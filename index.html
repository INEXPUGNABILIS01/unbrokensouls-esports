<!DOCTYPE html>
<html>
<head>
  <title>Registration for Guild</title>
</head>

<body>

<h2>Unbroken Souls Esports</h2>

<p>
The registration is for players who want
to make teams, join guilds of Unbroken Souls
Esports and play esports.
</p>

<form
  action="action="https://script.google.com/macros/s/AKfycbwd-i9Ohn-TwlaSA0YEWCKsjKIuMYy7p355mbOzq9hmr1wSO7BPsxZHCGsboRCK-3Iu/exec""
  method="POST">

  Name:
  <input type="text" name="name" required>
  <br><br>

  IGN:
  <input type="text" name="ign" required>
  <br><br>

  Role:
  <br>

  <input type="radio" name="role" value="Primary Rusher" required>
  Primary Rusher
  <br>

  <input type="radio" name="role" value="Secondary Rusher">
  Secondary Rusher
  <br>

  <input type="radio" name="role" value="Supporter">
  Supporter
  <br>

  <input type="radio" name="role" value="Sniper">
  Sniper
  <br><br>

  Age:
  <input type="number" name="age" min="1" max="120" required>
  <br><br>

  <button type="submit">Submit Form</button>

</form>

</body>
</html>
